function buildThemeMenu(){
  themeMenu.innerHTML="";
  Object.entries(THEMES).forEach(([key,t])=>{
    const b=document.createElement("button");
    b.className=key===currentTheme?"active":"";
    b.innerHTML=`<span class="themeSwatch" style="background:${t.css["--void"]}"></span>${t.label}`;
    b.addEventListener("click",e=>{
      e.stopPropagation();
      applyTheme(key);
      themeSel.value=key;
      updateThemeIconTitle();
      closeThemeMenu();
    });
    themeMenu.appendChild(b);
  });
}
function onDocClickCloseThemeMenu(e){ if(!themeMenuWrap.contains(e.target)) closeThemeMenu(); }
function openThemeMenu(){
  if(typeof closeOrderMenu==="function") closeOrderMenu();
  buildThemeMenu();
  themeMenu.style.setProperty("--menu-shift","0px");
  themeMenu.classList.add("open");
  document.addEventListener("click",onDocClickCloseThemeMenu,{capture:true});
  // keep it fully on-screen: nudge horizontally if the centered position would clip an edge
  requestAnimationFrame(()=>{
    const r=themeMenu.getBoundingClientRect(), pad=8;
    let shift=0;
    if(r.right>innerWidth-pad) shift=(innerWidth-pad)-r.right;
    else if(r.left<pad) shift=pad-r.left;
    if(shift) themeMenu.style.setProperty("--menu-shift",shift+"px");
  });
}
function closeThemeMenu(){
  themeMenu.classList.remove("open");
  document.removeEventListener("click",onDocClickCloseThemeMenu,{capture:true});
}
// ---------------- METRO ORDER MENU (bottom bar, metro view only) ----------------
const orderBtn=document.getElementById("orderBtn"), orderMenu=document.getElementById("orderMenu");
function buildOrderMenu(){
  orderMenu.innerHTML=`<div class="omHead">${T("orderBy")}</div>`;
  ["release","story","steps"].forEach(m=>{
    const b=document.createElement("button");
    b.className=m===subOrderMode?"active":""; b.setAttribute("role","menuitemradio"); b.setAttribute("aria-checked",m===subOrderMode);
    b.textContent=(m===subOrderMode?"✓ ":"")+T("ord_"+m);
    b.addEventListener("click",e=>{ e.stopPropagation();
      if(m!==subOrderMode){ subOrderMode=m; renderSubway(); if(subFocus) renderFocus(subFocus,{keepScroll:true}); subMapWrap.scrollTop=0; saveToggles(); }
      updateOrderBtn(); closeOrderMenu(); });
    orderMenu.appendChild(b);
  });
}
function updateOrderBtn(){ orderBtn.title=T("orderBy")+": "+T("ord_"+subOrderMode); orderBtn.setAttribute("aria-label",orderBtn.title); }
function onDocClickCloseOrderMenu(e){ if(!e.target.closest("#orderWrap")) closeOrderMenu(); }
function openOrderMenu(){
  if(typeof closeThemeMenu==="function") closeThemeMenu();
  buildOrderMenu(); orderMenu.style.setProperty("--menu-shift","0px"); orderMenu.classList.add("open");
  document.addEventListener("click",onDocClickCloseOrderMenu,{capture:true});
  requestAnimationFrame(()=>{ const r=orderMenu.getBoundingClientRect(), pad=8; let sh=0;
    if(r.right>innerWidth-pad) sh=(innerWidth-pad)-r.right; else if(r.left<pad) sh=pad-r.left;
    if(sh) orderMenu.style.setProperty("--menu-shift",sh+"px"); });
}
function closeOrderMenu(){ orderMenu.classList.remove("open"); document.removeEventListener("click",onDocClickCloseOrderMenu,{capture:true}); }
orderBtn.addEventListener("click",e=>{ e.stopPropagation(); orderMenu.classList.contains("open")?closeOrderMenu():openOrderMenu(); });
updateOrderBtn();

themeIconBtn.addEventListener("click",e=>{
  e.stopPropagation();
  themeMenu.classList.contains("open") ? closeThemeMenu() : openThemeMenu();
});

// ---------------- INIT ----------------
(async ()=>{
  await loadWatched();       // restore watched state from storage
  await loadTheme();         // restore theme choice
  await loadToggles();       // restore God of Stories / Shared Elements / Spoiler-free choices
  // apply theme colors to JS globals + CSS BEFORE first build (no flash / correct first paint)
  const t=THEMES[currentTheme];
  document.documentElement && Object.entries(t.css).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
  PHASE_COLOR={...t.phase};
  WEAVE_COLOR=t.weave; SHARE_COLOR=t.share; WATCHED_COLOR=t.watched; WATCHED_INK=t.watchedInk;
  NODE_FILL=t.nodeFill; NODE_FILL_SERIES=t.nodeFillSeries; EDGE_STROKE=t.edgeStroke; CK_STROKE=t.ckStroke;
  applyThemeExtras(t);
  themeSel.value=currentTheme;
  updateThemeIconTitle();
  // sync the three toggle buttons' visuals to the restored state
  weaveBtn.classList.toggle("on",showWeaves);
  weaveBtn.style.background=showWeaves?WEAVE_COLOR:"var(--chip-bg)";
  sharesBtn.classList.toggle("on",showShares);
  sharesBtn.style.background=showShares?SHARE_COLOR:"var(--chip-bg)";
  sharesBtn.style.color=showShares?"#1a1305":"";
  spoilerBtn.classList.toggle("on",spoilerFree);
  spoilerBtn.innerHTML=spoilerBtnLabel();
  spoilerBtn.title=spoilerBtnTitle();
  spoilerBtn.style.background=spoilerFree?"var(--chip-bg)":"var(--btn-bg-on)";
  theoryDot.classList.toggle("on",showTheory);
  theoryDot.title=showTheory?"???":"";
  applyLangChrome();
  // show the icon matching the auto-selected default layout
  document.body.classList.toggle("orient-v", ORIENT==="v");
  updateOrientIcon();
  build(); fit();
  updateProgress();
  refreshThemedButtons();
  if(ORIENT==="v"){ openSubway(false); updateDensityLabel(); }
  addEventListener("resize",fit);
})();
</script>
