<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MCU Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap');
  :root{
    --void:#070b16; --ink:#eef2fb; --dim:#8590aa; --panel:#0e1626; --edge:#25324f;
    --bg-glow-a:rgba(63,174,109,.10); --bg-glow-b:rgba(91,124,196,.10);
    --chip-bg:#111a2c; --btn-bg:#182742; --btn-bg-on:#22345a; --ctl-bg:rgba(14,22,38,.9);
    --series-fill:#0a1120; --bar-fade-1:rgba(7,11,22,.97); --bar-fade-2:rgba(7,11,22,.6);
    /* phase palette */
    --p1:#e0533d; --p2:#e0902f; --p3:#d8c23a; --p4:#3fb98f; --p5:#3f8fd8; --p6:#8a63d8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:
      radial-gradient(1100px 620px at 82% -6%, var(--bg-glow-a), transparent 60%),
      radial-gradient(900px 520px at 6% 12%, var(--bg-glow-b), transparent 58%),
      var(--void);
    color:var(--ink);font-family:'Barlow',system-ui,sans-serif;overflow:hidden;transition:background .35s,color .35s;
    touch-action:manipulation}  /* kills native double-tap-to-zoom everywhere except where overridden below */

  .bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;
    padding:13px 20px;background:linear-gradient(180deg,var(--bar-fade-1),var(--bar-fade-2) 75%,transparent);pointer-events:none}
  .bar h1{font-family:'Oswald';font-weight:700;text-transform:uppercase;font-size:1.25rem;line-height:1}
  .bar h1 small{display:block;font-family:'Barlow Condensed';font-weight:600;letter-spacing:.28em;
    font-size:.58rem;color:var(--p4);margin-bottom:3px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;pointer-events:auto}
  /* on desktop these wrappers are invisible (display:contents) — their children behave exactly
     as if they were direct children of .right, same as before this markup was grouped for mobile */
  .toggleGroup,.counterRow{display:contents}
  .hint{order:1}
  #progress{order:2}
  #spoilerBtn{order:3}
  #filtersToggle{order:4}
  #weaveBtn{order:5}
  #sharesBtn{order:6}
  .chip{font-family:'Barlow Condensed';font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    font-size:.68rem;padding:4px 10px;border-radius:20px;border:1px solid var(--edge);
    background:var(--chip-bg);color:var(--dim);cursor:pointer;transition:.15s;user-select:none}
  .chip.on{color:#fff}
  #spoilerBtn{padding:7px 9px;display:inline-flex;align-items:center;justify-content:center}
  .right{margin-left:auto;display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  .toggle{display:flex;background:var(--chip-bg);border:1px solid var(--edge);border-radius:22px;overflow:hidden;flex:0 0 auto}
  .toggle button{background:none;border:none;color:var(--dim);font-family:'Barlow Condensed';
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.72rem;padding:7px 14px;cursor:pointer;
    white-space:nowrap;flex:0 0 auto}
  .toggle button.on{background:var(--btn-bg-on);color:#fff}
  .hint{font-size:.72rem;color:var(--dim);font-style:italic}
  .progress{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.06em;font-size:.74rem;
    color:#2ecc71;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.4);
    padding:5px 10px;border-radius:20px;pointer-events:auto;white-space:nowrap}

  #stage{position:absolute;inset:0;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  #tree{position:absolute;top:0;left:0;transform-origin:0 0;transition:none}

  svg{display:block;overflow:visible}
  .link{fill:none;stroke:var(--edge);stroke-width:1.8;opacity:.5;transition:opacity .2s,stroke-width .2s}
  .link.weave{stroke-width:2.2;opacity:.9;stroke-dasharray:2 6;stroke-linecap:round;
    filter:drop-shadow(0 0 3px rgba(179,136,255,.7))}
  .link.shares{stroke-width:2;opacity:.85;stroke-dasharray:7 5;stroke-linecap:round;
    filter:drop-shadow(0 0 3px rgba(240,180,70,.65))}
  .link.saga{stroke-width:3;opacity:.6}
  .link.theory{stroke-width:2.1;opacity:.7;stroke-dasharray:1 6;stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(224,83,61,.65));animation:theoryPulse 2.4s ease-in-out infinite}
  svg.dim .link:not(.hot){opacity:.05}
  .link.hot{opacity:.95;stroke-width:3.2}
  .link.weave.hot{opacity:.95;stroke-width:2.4}
  .link.shares.hot{opacity:.98;stroke-width:2.6}
  .link.theory.hot{opacity:1;stroke-width:2.6}
  @keyframes theoryPulse{0%,100%{opacity:.45}50%{opacity:.9}}
  @keyframes theoryGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(224,83,61,0))}50%{filter:drop-shadow(0 0 9px rgba(224,83,61,.85))}}

  .node{cursor:pointer;transition:opacity .2s}
  .node .card{fill:var(--panel);stroke-width:1.6;rx:9}
  .node.series .card{stroke-dasharray:3 3;fill:var(--series-fill)}
  .node.theory .card{stroke-dasharray:2 5;animation:theoryGlow 2.6s ease-in-out infinite}
  .node .ttl{font-family:'Oswald';font-weight:500;fill:var(--ink)}
  .node .yr{font-family:'Barlow Condensed';font-weight:600;fill:var(--dim);letter-spacing:.08em}
  .node .tagtxt{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;fill:#0a0e18}
  svg.dim .node{opacity:.12}
  svg.dim .node.keep{opacity:1}
  .node.hot .card{filter:drop-shadow(0 0 12px currentColor)}
  .node.filtered{opacity:.13}
  .link.filtered{opacity:.05!important}

  #info{position:fixed;z-index:40;max-width:290px;background:var(--panel);border:1px solid var(--edge);
    border-radius:11px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.55);
    opacity:0;transform:translateY(6px);transition:.15s;pointer-events:none}
  #info.on{opacity:1;transform:none}
  #info .t{font-family:'Oswald';font-weight:600;font-size:1.05rem;line-height:1.12}
  #info .tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 9px}
  #info .tg{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    font-size:.64rem;padding:2px 7px;border-radius:5px;color:#0a0e18}
  #info .d{font-size:.85rem;color:#cdd6ea;line-height:1.45}
  #info .d.locked{position:relative}
  #info .d.locked .blurtext{filter:blur(5px);opacity:.7;user-select:none;display:block}
  #info .d.locked .lockrow{display:block;margin-top:7px;font-size:.72rem;color:#f0c05a;
    font-family:'Barlow Condensed';letter-spacing:.04em;filter:none}
  /* mobile tap-to-pin mode: fixed bottom-sheet placement, tappable, with a visible close button.
     Desktop hover mode never gets the .pinned class, so its cursor-following behavior is untouched. */
  #info.pinned{pointer-events:auto;left:12px!important;right:12px;top:auto!important;
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);max-width:none;width:auto;
    padding-right:40px}
  .infoClose{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
    border:1px solid var(--edge);background:var(--chip-bg);color:var(--ink);font-size:.85rem;
    cursor:pointer;display:grid;place-items:center;line-height:1}
  .infoClose:hover{background:var(--btn-bg-on)}
  .infoCheck{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 12px;width:100%;
    border-radius:9px;border:1px solid var(--edge);background:var(--chip-bg);color:var(--ink);
    font:600 .85rem 'Barlow',system-ui,sans-serif;cursor:pointer;text-align:left}
  .infoCheck .box{width:20px;height:20px;border-radius:50%;border:2px solid var(--dim);flex:none;
    display:grid;place-items:center;font-size:.75rem;line-height:1;color:transparent;transition:.15s}
  .infoCheck.on{border-color:var(--watched-c,#2ecc71)}
  .infoCheck.on .box{background:var(--watched-c,#2ecc71);border-color:var(--watched-c,#2ecc71);color:var(--watched-ink,#04120c)}
  .check{transition:opacity .15s}
  .check:hover circle{stroke:#2ecc71!important}
  .node.watched .card{stroke-opacity:.9}
  .node.watched{filter:saturate(1.05)}
  #info .c{margin-top:8px;font-size:.78rem}
  #info .c.f{color:var(--p4)} #info .c.b{color:var(--dim)}

  .ctl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;
    background:var(--ctl-bg);border:1px solid var(--edge);padding:7px;border-radius:30px;backdrop-filter:blur(6px)}
  .ctl button{background:var(--btn-bg);color:var(--ink);border:1px solid var(--edge);width:34px;height:34px;
    border-radius:50%;font-size:1rem;cursor:pointer;display:grid;place-items:center}
  .ctl button:hover{background:var(--btn-bg-on)}
  .ctl .lbl{display:grid;place-items:center;padding:0 12px;font-size:.74rem;color:var(--dim);
    font-family:'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase}

  /* separator between zoom controls and the orientation button */
  #langBtn{font-family:'Oswald',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.06em}
  .ctl-sep{width:1px;align-self:stretch;background:var(--edge);margin:2px 2px}
  /* orientation icon button (inherits .ctl button round style); icon swaps per layout */
  #orientSwitch svg{width:17px;height:17px;display:block}
  #orientSwitch svg [data-fill]{fill:var(--ink)}

  /* compact theme icon button — lives in the zoom bar, replaces the dropdown in vertical mode */
  .themeMenuWrap{position:relative;display:flex}
  #orderWrap{display:none}

  @media (max-width:760px){
    /* metro view has one extra button (order) — tighten the bar so it fits a phone */
    .ctl{gap:6px!important;padding:7px 8px!important}
    .ctl > button,.themeMenuWrap > button{width:36px!important;height:36px!important;font-size:1.05rem}
    .ctl .lbl{min-width:58px;padding:0 2px!important;font-size:.62rem!important}
  }
  @media (max-width:430px){
    .ctl .lbl{display:none!important}
  }
  @media (max-width:380px){
    .ctl{gap:4px!important;padding:6px!important}
    .ctl > button,.themeMenuWrap > button{width:34px!important;height:34px!important}
  }
  body.orient-v #orderWrap{display:flex}
  .themeMenu .omHead{font:600 .62rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:3px 6px 2px}
  #themeIconBtn svg{display:block}
  .themeMenu{position:absolute;bottom:calc(100% + 10px);left:50%;
    transform:translateX(calc(-50% + var(--menu-shift,0px))) translateY(6px);
    display:flex;flex-direction:column;gap:3px;min-width:132px;
    background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:5px;
    box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .15s ease, transform .15s ease}
  .themeMenu.open{opacity:1;pointer-events:auto;transform:translateX(calc(-50% + var(--menu-shift,0px))) translateY(0)}
  .themeMenu button{display:flex;align-items:center;gap:7px;background:var(--chip-bg);color:var(--ink);
    border:1px solid var(--edge);border-radius:7px;padding:6px 9px;font-family:'Barlow Condensed';
    font-weight:600;font-size:.68rem;letter-spacing:.02em;text-align:left;cursor:pointer;width:100%}
  .themeMenu button:hover{background:var(--btn-bg-on)}
  .themeMenu button.active{border-color:var(--p4);color:#fff}
  .themeSwatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(255,255,255,.3)}

  /* dropdown is fully replaced by the compact icon + popover now, in both orientations */
  .themePicker{position:fixed;bottom:18px;right:18px;z-index:20;display:none;align-items:center;gap:8px;
    background:var(--ctl-bg);border:1px solid var(--edge);padding:7px 10px 7px 14px;border-radius:30px;
    backdrop-filter:blur(6px);transition:background .35s,border-color .35s}
  .themePicker label{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    font-size:.7rem;color:var(--dim)}
  .themePicker select{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:16px;
    padding:6px 10px;font-family:'Barlow Condensed';font-weight:600;font-size:.76rem;letter-spacing:.04em;
    cursor:pointer;outline:none}
  .themePicker select:focus{border-color:var(--p4)}

  /* ---- Jump rail: phase navigator, only relevant in vertical (chapters) layout ---- */
  .jumpRail{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:18;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    background:var(--ctl-bg);border:1px solid var(--edge);border-radius:16px;
    padding:9px 7px;backdrop-filter:blur(6px);transition:transform .25s ease, opacity .25s ease}
  .jumpRail.collapsed{transform:translateY(-50%) translateX(-52px)}
  .jumpRail .jrToggle{width:36px;height:36px;border-radius:10px;border:1px solid var(--edge);
    background:var(--btn-bg);color:var(--ink);cursor:pointer;font-size:1.15rem;line-height:1;
    display:grid;place-items:center;flex:0 0 auto}
  .jumpRail .jrToggle:hover{background:var(--btn-bg-on)}
  .jumpRail .jrPhases{display:flex;flex-direction:column;gap:7px;transition:opacity .2s;overflow:hidden}
  .jumpRail.collapsed .jrPhases{opacity:0;pointer-events:none;width:0;height:0}
  .jrPhaseBtn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--jr-c,var(--edge));
    background:var(--chip-bg);color:var(--ink);font-family:'Oswald';font-weight:700;font-size:.78rem;
    cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:background .15s}
  .jrPhaseBtn:hover{background:var(--jr-c,var(--btn-bg-on));color:#04120c}
  .jumpRail[hidden]{display:none}

  /* mobile-only filter toggle button (hidden on desktop) */
  .filtersToggle{display:none}

  /* ---------------- MOBILE ---------------- */
  @media (max-width:760px){
    .bar{flex-wrap:wrap;gap:8px 10px;padding:10px 12px;
      background:linear-gradient(180deg,var(--bar-fade-1),var(--bar-fade-1) 100%)}
    .bar h1{font-size:1.05rem;flex:0 1 auto}
    .bar h1 small{font-size:.5rem;letter-spacing:.2em}
    .hint{display:none}
    /* toggleGroup (God of Stories / Shared Elements) stays transparent — flows near the title on
       the top row. counterRow (eye icon + counter + tags) gets a guaranteed dedicated row below,
       left-aligned — width:100% forces the line break, same technique the tag list uses. */
    .right,.toggleGroup{display:contents}
    .counterRow{display:flex;align-items:center;gap:8px;width:100%;order:10;pointer-events:auto}
    /* cancel the desktop-only sequencing order (2/3/4) so DOM order (eye, counter, tags) applies
       now that counterRow is a real nested flex box on mobile — must match ID specificity to win */
    #spoilerBtn,#progress,#filtersToggle{order:0}
    .filtersToggle{display:inline-flex;align-items:center;gap:6px;
      font-family:'Barlow Condensed';font-weight:600;text-transform:uppercase;letter-spacing:.06em;
      font-size:.72rem;padding:7px 12px;border-radius:20px;border:1px solid var(--edge);
      background:var(--chip-bg);color:var(--ink);cursor:pointer}
    .filtersToggle .cnt{background:var(--p4);color:#04120c;border-radius:10px;
      padding:0 6px;font-size:.66rem;min-width:16px;text-align:center}
    /* the expanded tag list itself still gets its own dedicated row at the bottom of the bar —
       order must be higher than every toolbar button's order (1-6) so it never interleaves with them
       now that they're all direct flex items of .bar on mobile */
    .filters{order:20;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;
      padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
    .filters::-webkit-scrollbar{display:none}
    .filters.collapsed{display:none}
    .filters .chip{flex:0 0 auto;padding:7px 12px;font-size:.72rem}
    #weaveBtn{font-size:.68rem;padding:6px 10px}
    .toggle button{padding:8px 12px;font-size:.7rem}
    /* bigger touch targets for zoom controls, sit above home bar */
    .ctl{bottom:max(14px,env(safe-area-inset-bottom));gap:10px;padding:8px}
    .ctl button{width:42px;height:42px;font-size:1.15rem}
    #themeMenu button,#orderMenu button{width:100%;height:auto;font-size:.68rem}   /* not a zoom control — override .ctl button's fixed square sizing */
    .ctl .lbl{padding:0 8px;font-size:.7rem}
    #info{max-width:min(84vw,290px)}
    .themePicker{right:10px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);padding:5px 8px 5px 10px;gap:5px}
    .themePicker label{display:none}
    .themePicker select{font-size:.7rem;padding:5px 8px}
  }
  @media (max-width:400px){
    .bar h1 small{display:none}
    .bar h1{font-size:.95rem}
  }
  /* hidden easter-egg toggle: near-invisible until hovered/discovered */
  #theoryDot{display:inline-block;margin-left:7px;font-size:.5em;opacity:.08;cursor:default;
    vertical-align:super;user-select:none;transition:opacity .5s,color .5s;pointer-events:auto}
  #theoryDot:hover{opacity:.55;cursor:pointer}
  #theoryDot.on{opacity:1;color:#e0533d;animation:theoryGlow 2.6s ease-in-out infinite}

  /* ================= SUBWAY VIEW (B) + FOCUS VIEW (C) ================= */
  body.orient-v .ctl{z-index:37}
  body.orient-v #reset{display:none}
  body.orient-v .ctl .lbl{min-width:74px;text-transform:uppercase;font:600 .7rem 'Barlow Condensed';letter-spacing:.08em}
  .ctl button:disabled{opacity:.35;cursor:default}
  #subMapWrap{touch-action:pan-y}
  #subMap{padding-bottom:96px}
  #subway{position:fixed;inset:0;z-index:35;background:var(--void);display:none;color:var(--ink);font-family:'Barlow',system-ui,sans-serif}
  #subway.on{display:block}
  #subMapWrap,#subFocus{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    transition:opacity .28s ease,transform .34s cubic-bezier(.2,.8,.2,1)}
  #subMapWrap.away{opacity:0;transform:scale(.97);pointer-events:none}
  #subFocus{opacity:0;pointer-events:none;transform:translateY(14px)}
  #subFocus.on{opacity:1;pointer-events:auto;transform:none}
  .subInner{max-width:640px;margin:0 auto}
  #subHead{position:sticky;top:0;z-index:3;background:var(--void);padding:12px 14px 8px;border-bottom:1px solid var(--edge)}
  .subTop{display:flex;align-items:center;gap:10px}
  .subTitle{font-family:'Oswald';font-weight:700;text-transform:uppercase;font-size:1.1rem;flex:1;line-height:1}
  .subTitle small{display:block;font-family:'Barlow Condensed';font-weight:600;letter-spacing:.24em;font-size:.56rem;color:var(--p4,#3fb98f);margin-bottom:3px}
  .subProg{font:600 .78rem 'Barlow Condensed';letter-spacing:.06em;color:#2ecc71;border:1px solid rgba(46,204,113,.45);border-radius:999px;padding:4px 9px}
  .subBtn{background:var(--btn-bg);color:var(--ink);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;
    font:600 .76rem 'Barlow Condensed';letter-spacing:.07em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .subBtn:hover{background:var(--btn-bg-on)}
  #subSpoil{padding:6px 9px;line-height:0}
  #subTip{position:fixed;z-index:45;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
    font:600 .74rem 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--c,#333);
    border-radius:999px;padding:4px 10px;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap}
  #subTip.on{opacity:1;transform:none}
  #subMap .track{transition:stroke-width .12s}
  #subMap .track.hl{stroke-width:7px}
  #subMap g.row.lineSel .lead{stroke-width:1.8;opacity:1}
  #subMap .track.gap.hl{stroke-width:3px;opacity:1}
  #subMap .trackHit{cursor:help}
  .subOrder{display:flex;align-items:center;gap:4px;margin-top:9px;flex-wrap:wrap}
  .subOrder span{font:600 .66rem 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:4px}
  .subOrd{background:var(--chip-bg);color:var(--dim);border:1px solid var(--edge);border-radius:999px;padding:3px 10px;cursor:pointer;
    font:600 .7rem 'Barlow Condensed';letter-spacing:.07em;text-transform:uppercase}
  .subOrd.on{background:var(--btn-bg-on);color:var(--ink);border-color:var(--dim)}
  body.theme-comic .subOrder span{color:#fff}
  body.theme-comic .subOrd{border:2px solid #141010;border-radius:3px;background:#fff;color:#141010}
  body.theme-comic .subOrd.on{background:#ffc400}
  body.theme-hud .subOrd{border-radius:2px}
  .subChips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .subChips::-webkit-scrollbar{display:none}
  .subChip{flex:none;border:1.5px solid var(--c);background:transparent;color:var(--dim);border-radius:999px;padding:5px 11px;
    font:600 .74rem 'Barlow Condensed';letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:.15s}
  .subChip.on{background:var(--c);color:#fff}
  .subHint{font-size:.72rem;color:var(--dim);min-height:1.1em;margin-top:5px;transition:color .2s}
  .subHint.warn{color:#e0533d}
  #subMap svg{display:block;width:100%}
  #subMap .row{cursor:pointer}
  #subMap .rowBg{fill:transparent;transition:fill .18s}
  #subMap .row:hover .rowBg{fill:var(--chip-bg)}

<script>
// Outside Claude's chat preview (e.g. the published page) there is no window.storage:
// fall back to this browser's own storage so watched titles and settings are remembered on the device.
if(!window.storage){
  window.storage={
    get:async k=>{ try{ const v=localStorage.getItem(k); return v==null?null:{key:k,value:v}; }catch(e){ return null; } },
    set:async (k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} return {key:k,value:v}; },
    delete:async k=>{ try{ localStorage.removeItem(k); }catch(e){} return {key:k,deleted:true}; }
  };
}
// ---------------- TAG DEFINITIONS ----------------
let PHASE_COLOR={0:"#5a6478",1:"#e0533d",2:"#e0902f",3:"#d8c23a",4:"#3fb98f",5:"#3f8fd8",6:"#8a63d8",7:"#d0508c"};

//  · theme   — a thread that cuts across series. In the metro view a theme is shown by highlighting, never as a line.
const FRAN={
  // series
  iron:{l:"Iron Man",c:"#d1443a",kind:"series"}, cap:{l:"Cap",c:"#4d7bd1",kind:"series"}, thor:{l:"Thor",c:"#4aa3c4",kind:"series"},
  team:{l:"Avengers",c:"#c9a13b",kind:"series"}, widow:{l:"Black Widow",c:"#a7a9be",kind:"series"}, hulk:{l:"Hulk",c:"#8fbf3a",kind:"series"},
  cmarvel:{l:"Capt. Marvel",c:"#e8954a",kind:"series"}, drstrange:{l:"Dr. Strange",c:"#7f5be0",kind:"series"},
  wanda:{l:"Wanda",c:"#d9447a",kind:"series"}, antman:{l:"Ant-Man",c:"#ff7f6e",kind:"series"},
  guard:{l:"Guardians",c:"#54ad5c",kind:"series"}, spidey:{l:"Spidey",c:"#c74b58",kind:"series"},
  wakanda:{l:"Wakanda",c:"#3f9b8c",kind:"series"}, ff:{l:"Fan. Four",c:"#6a8cff",kind:"series"},
  xmen:{l:"X-Men",c:"#6b8cae",kind:"series"}, dd:{l:"Daredevil",c:"#b23a5c",kind:"series"},
  // themes
  strange:{l:"Mystic",c:"#9b6cd0",kind:"theme"}, multiverse:{l:"Multiverse",c:"#2bb3c0",kind:"theme"},
  cosmic:{l:"Cosmic",c:"#7a86c4",kind:"theme"}, street:{l:"Street",c:"#b05a4a",kind:"theme"}
};
const isTheme=k=>FRAN[k]&&FRAN[k].kind==="theme";
const isSeries=k=>FRAN[k]&&FRAN[k].kind==="series";

// Metro view: every series is a (toggleable) line; themes are highlighted, never drawn as lines
const SUB_CODES=[];
const SUB_LINE_KEYS=Object.keys(FRAN).filter(isSeries);

];

const FRAN_BASE={}; Object.entries(FRAN).forEach(([k,f])=>FRAN_BASE[k]=f.c);
// per-theme extras beyond colour variables: body class (fonts, shapes, textures) and line colours
function applyThemeExtras(t){
  Object.values(THEMES).forEach(x=>{ if(x.bodyClass) document.body.classList.remove(x.bodyClass); });
  if(t.bodyClass) document.body.classList.add(t.bodyClass);
  Object.keys(FRAN).forEach(k=>{ FRAN[k].c=(t.fran&&t.fran[k])||FRAN_BASE[k]; });
}
let currentTheme="midnight";

function applyTheme(name){
  const t=THEMES[name]; if(!t) return;
  currentTheme=name;
  // 1) CSS chrome variables
  const root=document.documentElement;
  Object.entries(t.css).forEach(([k,v])=>root.style.setProperty(k,v));
  // 2) JS accent colors used when drawing the SVG
  PHASE_COLOR={...t.phase};
  WEAVE_COLOR=t.weave; SHARE_COLOR=t.share;
  WATCHED_COLOR=t.watched; WATCHED_INK=t.watchedInk;
  NODE_FILL=t.nodeFill; NODE_FILL_SERIES=t.nodeFillSeries;
  EDGE_STROKE=t.edgeStroke; CK_STROKE=t.ckStroke;
  applyThemeExtras(t);
  if(typeof renderFilters==="function") renderFilters();
  if(typeof subOpen!=="undefined" && subOpen){ renderSubway(); if(subFocus) renderFocus(subFocus,{keepScroll:true}); }
  // 3) persist choice
  try{ if(window.storage) window.storage.set("mcu:theme", name); }catch(e){}
  // 4) redraw if the tree already exists
  if(typeof svg!=="undefined" && svg){ build(); refreshThemedButtons(); }
}
async function loadTheme(){
  try{
    const r=await window.storage.get("mcu:theme");
    if(r&&r.value&&THEMES[r.value]) currentTheme=r.value;
  }catch(e){}
}
// re-tint the accent toggle buttons that use inline colors
function refreshThemedButtons(){
  const wb=document.getElementById("weaveBtn");
  if(wb){ wb.style.borderColor=WEAVE_COLOR; if(showWeaves) wb.style.background=WEAVE_COLOR; }
  const sb=document.getElementById("sharesBtn");
  if(sb){ sb.style.borderColor=SHARE_COLOR; if(showShares){ sb.style.background=SHARE_COLOR; sb.style.color="#1a1305";} }
}

// Horizontal layout: phases become columns, films/series within a phase stack vertically as a column.
function layout(){

  for(let p=0;p<=MAX_PHASE;p++) phases[p]=phases[p]||[];  // guarantee every phase bucket exists, even if empty
  // order within each phase: cluster children under parents, then by year
  const order={};
  for(let p=0;p<=MAX_PHASE;p++){
    let arr=phases[p].slice();
    arr.sort((a,b)=>{
      if(p===0){

        if(la!==lb) return la-lb;
      }
      const pa=a.parent?BY[a.parent]:null, pb=b.parent?BY[b.parent]:null;
      const oa=pa?(order[pa.id]??999):-1, ob=pb?(order[pb.id]??999):-1;
      return oa-ob || a.y-b.y || (a.series?1:0)-(b.series?1:0) || a.id.localeCompare(b.id);
    });
    arr.forEach((n,i)=>order[n.id]=i);
    phases[p]=arr;
  }
  // assign coordinates: phase = column (x), position within phase = row (y)
  const d=D();
  const cross=d.h+d.gapCross;   // vertical spacing between films within one phase's column
  const main=d.w+d.gapMain;     // horizontal spacing between phase columns
  const pos={}, legacySubInfo={};   // legacySubInfo: per sub-universe vertical bounds, for Phase 0's column labels

      const subGapExtra=30;
      const yPos=[]; let cy=0, lastLegacy=null;
      arr.forEach((n,i)=>{
        if(i>0 && n.legacy!==lastLegacy) cy+=subGapExtra;
        yPos.push(cy); cy+=cross; lastLegacy=n.legacy;
      });
      const offset=(cy-cross)/2;
      arr.forEach((n,i)=>{ pos[n.id]={x:p*main, y:yPos[i]-offset}; });
      LEGACY_GROUPS.forEach(g=>{
        const idxs=arr.map((n,i)=>n.legacy===g.key?i:-1).filter(i=>i>=0);
        if(!idxs.length) return;
        legacySubInfo[g.key]={
          top:yPos[idxs[0]]-offset-d.h/2,
          bottom:yPos[idxs[idxs.length-1]]-offset+d.h/2,
          color:g.color, label:g.label
        };
      });
    } else {
      const span=(arr.length-1)*cross;
      arr.forEach((n,i)=>{ pos[n.id]={x:p*main, y:i*cross-span/2}; });
    }
  }
  return {pos,phases,legacySubInfo};
}

  });
  edges.forEach(([a,b,kind])=>{
    let cls="link"+(kind==="weave"?" weave":"")+(kind==="shares"?" shares":"")+(kind==="theory"?" theory":"");
    const col = kind==="weave" ? WEAVE_COLOR
              : kind==="shares" ? SHARE_COLOR
              : kind==="theory" ? "#e0533d"
              : "var(--edge)";
    const pe=ec("path",{class:cls,d:edgePath(pos[a],pos[b])});
    pe.style.stroke=col;              // inline style beats the .link stylesheet rule
    pe.dataset.a=a; pe.dataset.b=b;
    linkLayer.appendChild(pe);
  });

  // nodes
  const nodeLayer=ec("g",{class:"nodeLayer"}); root.appendChild(nodeLayer);
  vis.forEach(n=>{
    const P=pos[n.id];
    const c=(n.p===0 && n.legacy && LEGACY_COLOR[n.legacy]) ? LEGACY_COLOR[n.legacy] : PHASE_COLOR[n.p];
    const g=ec("g",{class:"node"+(n.series?" series":"")+(n.theory?" theory":"")+(n.fr.some(isTheme)?" thm":""),
      transform:`translate(${P.x-d.w/2},${P.y-d.h/2})`});
    g.style.color=c;
    const card=ec("rect",{class:"card",x:0,y:0,width:d.w,height:d.h,rx:9,stroke:c});
    g.appendChild(card);

    // landscape card (title reads left-to-right) — used in both horizontal and vertical (chapters) layouts
    g.appendChild(ec("rect",{x:3,y:8,width:3,height:d.h-16,rx:1.5,fill:c})); // left accent
    const yr=ec("text",{class:"yr",x:14,y:16,"font-size":9.5});
    yr.textContent=n.y+(n.series?" · SERIES":""); g.appendChild(yr);
    const ti=ec("text",{class:"ttl",x:14,y:31,"font-size":11});
    ti.textContent=n.t.length>26?n.t.slice(0,25)+"…":n.t; g.appendChild(ti);
    let tx=14; const maxX=d.w-28;   // keep clear of the watched check
    [...n.fr.filter(isSeries),...n.fr.filter(isTheme)].forEach(fk=>{
      const f=FRAN[fk]; if(!f)return;
      const w=f.l.length*5.4+12;
      if(tx+w>maxX){   // no room: show as a small dot
        g.appendChild(ec("circle",{cx:tx+4,cy:43.5,r:3.2,fill:isTheme(fk)?"none":f.c,stroke:f.c,"stroke-width":1.4})); tx+=10; return; }
      if(isTheme(fk)){
        g.appendChild(ec("rect",{x:tx+.5,y:38.5,width:w-1,height:10,rx:3,fill:"none",stroke:f.c,"stroke-width":1}));
        const tt=ec("text",{class:"tagtxt",x:tx+6,y:46.5,"font-size":8,fill:f.c}); tt.style.fill=f.c;
        tt.textContent=f.l; g.appendChild(tt);
      }else{
        g.appendChild(ec("rect",{x:tx,y:38,width:w,height:11,rx:3,fill:f.c,opacity:.92}));
        const tt=ec("text",{class:"tagtxt",x:tx+6,y:46.5,"font-size":8});
        tt.textContent=f.l; g.appendChild(tt);
      }
      tx+=w+4;
    });
    g.dataset.id=n.id;

    // ---- WATCHED check-toggle (top-right in landscape, top-right in portrait) ----
    const isW=watched.has(n.id);
    const ckR=8;
    const ckX = d.w-15;
    const ckY = d.h/2;
    const check=ec("g",{class:"check"+(isW?" on":""),style:"cursor:pointer"});
    check.appendChild(ec("circle",{cx:ckX,cy:ckY,r:ckR,
      fill:isW?WATCHED_COLOR:"transparent",stroke:isW?WATCHED_COLOR:CK_STROKE,"stroke-width":1.5}));
    // checkmark path (shown when watched)
    const tick=ec("path",{d:`M ${ckX-3.6} ${ckY} l 2.4 2.6 l 4.6 -5`,
      fill:"none",stroke:WATCHED_INK,"stroke-width":1.8,"stroke-linecap":"round",
      "stroke-linejoin":"round",opacity:isW?1:0});
    check.appendChild(tick);
    check.addEventListener("click",e=>{ e.stopPropagation(); toggleWatched(n.id); });
    g.appendChild(check);
    if(isW) g.classList.add("watched");

    nodeLayer.appendChild(g);
    g.addEventListener("mouseenter",()=>focus(n));
    g.addEventListener("mouseleave",clear);
    g.addEventListener("mousemove",e=>moveInfo(e));
  });

  applyFilter();
  refreshJumpRail();
  return {W,H};
}

let lastFocus=null;
let pinnedNode=null;   // set on mobile when a node is tapped-open (persists until dismissed); always null on desktop
function toggleWatched(id){
  if(watched.has(id)) watched.delete(id); else watched.add(id);
  saveWatched();
  // update just this node's check + watched class without a full rebuild
  const g=svg.querySelector(`.node[data-id="${id}"]`);

  // if the info card is currently showing this node, refresh its blur state
  if(lastFocus && lastFocus.id===id && info.classList.contains("on")) focus(lastFocus);
}
function neigh(n){
  const s=new Set([n.id]);
  if(n.parent)s.add(n.parent);
  n.links.forEach(t=>s.add(t));
  if(showWeaves && n.weaves) n.weaves.forEach(t=>s.add(t));
  if(showShares && n.shares) n.shares.forEach(([t])=>s.add(t));
  if(showTheory && n.theoryLinks) n.theoryLinks.forEach(t=>s.add(t));
  visN().forEach(x=>{
    if(x.parent===n.id)s.add(x.id);
    if(x.links.includes(n.id))s.add(x.id);
    if(showWeaves && x.weaves && x.weaves.includes(n.id))s.add(x.id);
    if(showShares && x.shares && x.shares.some(([t])=>t===n.id))s.add(x.id);
    if(showTheory && x.theoryLinks && x.theoryLinks.includes(n.id))s.add(x.id);
  });
  return s;
}
function focus(n){
  lastFocus=n;

  svg.querySelectorAll(".node").forEach(g=>g.classList.toggle("keep",set.has(g.dataset.id)));
  svg.querySelectorAll(".node").forEach(g=>g.classList.toggle("hot",g.dataset.id===n.id));
  svg.querySelectorAll(".link").forEach(l=>l.classList.toggle("hot",l.dataset.a===n.id||l.dataset.b===n.id));
  // "Sets up" = explicit links AND any node that structurally grows from n (n is its parent)
  const feedIds=new Set(n.links);
  visN().forEach(x=>{ if(x.parent===n.id) feedIds.add(x.id); });
  const feeds=[...feedIds].map(t=>BY[t]?.t).filter(Boolean);
  // "Builds on" = nodes that link to n AND n's own structural parent
  const parentIds=new Set(visN().filter(x=>x.links.includes(n.id)).map(x=>x.id));
  if(n.parent && (!BY[n.parent].theory || showTheory)) parentIds.add(n.parent);
  const parents=[...parentIds].map(t=>BY[t]?.t).filter(Boolean);
  const weaves = showWeaves ? [
    ...(n.weaves||[]).map(t=>BY[t]?.t),
    ...visN().filter(x=>x.weaves&&x.weaves.includes(n.id)).map(x=>x.t)
  ].filter(Boolean) : [];
  const shares = showShares ? [
    ...(n.shares||[]).map(([t,lbl])=> BY[t]?`${BY[t].t} (${lbl})`:null),
    ...visN().filter(x=>x.shares&&x.shares.some(([t])=>t===n.id))
        .map(x=>{ const s=x.shares.find(([t])=>t===n.id); return `${x.t} (${s[1]})`; })
  ].filter(Boolean) : [];
  // 🕸 hidden fan-theory connections (only populated once the theory dot is unlocked)
  const theories = showTheory ? [
    ...(n.theoryLinks||[]).map(t=>BY[t]?.t),
    ...visN().filter(x=>x.theoryLinks&&x.theoryLinks.includes(n.id)).map(x=>x.t)
  ].filter(Boolean) : [];
  const LEGACY_LABEL={fox:"Fox",netflix:"Netflix",sony:"Sony"};
  const tagChips=n.fr.filter(fk=>FRAN[fk]).map(fk=>{ const f=FRAN[fk];
      return isTheme(fk)
        ?`<span class="tg thTag" style="--c:${f.c}">${f.l}</span>`
        :`<span class="tg" style="background:${f.c}">${f.l}</span>`; }).join("")
    +`<span class="tg" style="background:${PHASE_COLOR[n.p]}">${PHASE_LABEL(n.p)}</span>`
    +(n.series?`<span class="tg" style="background:${CK_STROKE};color:#fff">${T("series")}</span>`:"")
    +(n.theory?`<span class="tg" style="background:#e0533d;color:#fff">${T("theoryTag")}</span>`:"")
    +(n.legacy?`<span class="tg" style="background:transparent;border:1px solid ${LEGACY_COLOR[n.legacy]};color:${LEGACY_COLOR[n.legacy]}" title="${T("legacyInfo")}">${LEGACY_LABEL[n.legacy]||n.legacy}</span>`:"");
  const isW=watched.has(n.id);
  const locked = spoilerFree && !isW && !n.theory;
  const desc = locked
    ? `<div class="d locked"><span class="blurtext">${DESC(n)}</span>
         <span class="lockrow">${T("locked")}</span></div>`
    : `<div class="d">${DESC(n)}</div>`;
  const memo = MEMO_HTML(n,"memo");
  const statusTag = isW
    ? `<span class="tg" style="background:${WATCHED_COLOR};color:${WATCHED_INK}">${T("watched")}</span>` : "";
  const isPinned = pinnedNode && pinnedNode.id===n.id;
  info.innerHTML=`${isPinned?`<button class="infoClose" aria-label="Close">✕</button>`:""}<div class="t">${n.t}</div>
    <div class="tags">${tagChips}${statusTag}</div>
    ${desc}
    ${memo}
    ${feeds.length?`<div class="c f">${T("setsUp")}: ${feeds.join(", ")}</div>`:""}
    ${parents.length?`<div class="c b">${T("buildsOn")}: ${parents.join(", ")}</div>`:""}
    ${weaves.length?`<div class="c" style="color:${WEAVE_COLOR}">${T("woven")}: ${weaves.join(", ")}</div>`:""}
    ${shares.length?`<div class="c" style="color:${SHARE_COLOR}">${T("shared")}: ${shares.join(", ")}</div>`:""}
    ${theories.length?`<div class="c" style="color:#e0533d">${T("theory")}: ${theories.join(", ")}</div>`:""}
    ${isPinned?`<button class="infoCheck${isW?" on":""}" data-id="${n.id}" role="checkbox" aria-checked="${isW}"
       style="--watched-c:${WATCHED_COLOR};--watched-ink:${WATCHED_INK}"><span class="box">✓</span>${isW?T("isWatched"):T("markWatched")}</button>`:""}
    ${isPinned&&typeof subOpen!=="undefined"&&subOpen?`<button class="infoFocusBtn" data-id="${n.id}">${T("toFocus")}</button>`:""}`;
  info.classList.toggle("pinned",!!isPinned);
  info.classList.add("on");
}
function moveInfo(e){
  if(pinnedNode) return;  // positioned via CSS while pinned; don't let a stray mousemove fight it
  const w=300,h=info.offsetHeight||160,pad=14;

  });
}

// ================= SUBWAY VIEW (B) + FOCUS VIEW (C) =================
// B: one coloured line per franchise tag, stations in phase→year order, interchanges where a title is on several lines.
// C: one title centred, its lines running in above / out below, neighbours to tap through.
// no line cap on wider screens; phones cap at 8 so titles stay readable. Track spacing adapts to the line count.
if(!subLines) subLines=SUB_LINE_KEYS.slice();
const subIsPhone=()=>matchMedia("(max-width:760px)").matches;
const subMax=()=>Infinity;
const subEl=document.getElementById("subway");
const subMapWrap=document.getElementById("subMapWrap");
const subFocusEl=document.getElementById("subFocus");
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// In-universe (story) order of the MCU titles — approximate, following Marvel's own timeline ordering.
// Legacy titles keep their release order in their own section; post–Secret Wars titles go last.
const STORY_ORDER=["cap1","cm","im1","im2","hulk","thor1","av1","im3","thor2","cap2","gg1","gg2","av2","ant1","cw","bw","bp1","sm1","ds1",
  "thor3","antw","iw","eg","loki","wv","sc1","fws","sm2","et","hawk","sm3","mk","ds2","msm","thor4","shulk","bp2","si","gghs","echo","gg3",
  "marvels","ant3","agatha","riri","dw","cbnw","tb","ddba","pun","wman","sbnd","tasm3","vq","ff2","doom","sw","xmen28","gr","bp3"];
const STORY_ERA=id=>{ const i=STORY_ORDER.indexOf(id);
  return i<0?2:i<=STORY_ORDER.indexOf("cm")?0:i<=STORY_ORDER.indexOf("iw")?1:i<=STORY_ORDER.indexOf("sw")?2:3; };
function subSteps(){
  // step = 1 + the deepest step of anything it builds on (story dependencies), starting points are step 1
  const memo={}, vis=new Set(visN().map(n=>n.id));
  const d=(n,seen)=>{ if(memo[n.id]) return memo[n.id]; if(seen.has(n.id)) return 1; seen.add(n.id);
    const ps=relations(n).parents.filter(b=>vis.has(b.id));
    return memo[n.id]=ps.length?1+Math.max(...ps.map(b=>d(b,seen))):1; };
  visN().forEach(n=>d(n,new Set()));
  return memo;
}
let subStepCache=null;
function subOrder(){
  const idx={}; N.forEach((n,i)=>idx[n.id]=i);
  const rel=(a,b)=>a.p-b.p||a.y-b.y||idx[a.id]-idx[b.id];
  const vis=visN().slice();
  if(subOrderMode==="story"){
    const si={}; STORY_ORDER.forEach((id,i)=>si[id]=i);
    return vis.sort((a,b)=>{ const la=a.p===0, lb=b.p===0; if(la!==lb) return la?-1:1; if(la) return rel(a,b);
      return (si[a.id]??999)-(si[b.id]??999)||rel(a,b); });
  }
  if(subOrderMode==="steps"){ const st=subStepCache||(subStepCache=subSteps()); return vis.sort((a,b)=>st[a.id]-st[b.id]||rel(a,b)); }
  return vis.sort(rel);
}
// section (header) each station falls under, for the current order
function subSection(n){
  if(subOrderMode==="steps"){ const st=subStepCache||(subStepCache=subSteps()); const k=st[n.id];
    return {key:"s"+k, label:T("step")+" "+k, color:"var(--dim)"}; }
  if(subOrderMode==="story"){
    if(n.p===0) return {key:"legacy", label:PHASE_LABEL(0), long:PHASE_LABEL(0)+" · "+SAGA(0), color:PHASE_COLOR[0]};
    const e=STORY_ERA(n.id); return {key:"e"+e, label:T(["eraPast","eraInfinity","eraBlip","eraAfter"][e]), color:PHASE_COLOR[[1,3,5,7][e]]};
  }
  return {key:"p"+n.p, label:PHASE_LABEL(n.p), long:PHASE_LABEL(n.p)+" · "+SAGA(n.p), color:PHASE_COLOR[n.p]};
}
function relations(n){
  const vis=visN(), ok=id=>BY[id]&&(!BY[id].theory||showTheory);
  const feeds=new Set(n.links.filter(ok)); vis.forEach(x=>{ if(x.parent===n.id) feeds.add(x.id); });
  const parents=new Set(vis.filter(x=>x.links.includes(n.id)).map(x=>x.id)); if(n.parent&&ok(n.parent)) parents.add(n.parent);
  const extra=[], seen=new Set();
  const add=(id,kind)=>{ if(ok(id)&&!seen.has(id+kind)){ seen.add(id+kind); extra.push([BY[id],kind]); } };
  if(showWeaves){ (n.weaves||[]).forEach(t=>add(t,"woven")); vis.forEach(x=>x.weaves&&x.weaves.includes(n.id)&&add(x.id,"woven")); }
  if(showShares){ (n.shares||[]).forEach(([t])=>add(t,"shared")); vis.forEach(x=>x.shares&&x.shares.some(([t])=>t===n.id)&&add(x.id,"shared")); }
  if(showTheory){ (n.theoryLinks||[]).forEach(t=>add(t,"theory")); vis.forEach(x=>x.theoryLinks&&x.theoryLinks.includes(n.id)&&add(x.id,"theory")); }
  return {feeds:[...feeds].map(id=>BY[id]), parents:[...parents].map(id=>BY[id]), extra};
}
// metro line membership = franchise tags + extra metro-only lines (e.g. Doomsday joins the Cap and FF lines)
const LK=n=>n.metro?[...n.fr,...n.metro.filter(k=>!n.fr.includes(k))]:n.fr;
const lineColor=n=>{ const k=LK(n).find(k=>isSeries(k)&&subLines.includes(k))||LK(n).find(isSeries)||n.fr.find(k=>FRAN[k]); return k?FRAN[k].c:"var(--dim)"; };

function renderSubHead(msg){
  const head=document.getElementById("subHead");
  const chips=SUB_LANE_ORDER.filter(isSeries).map(k=>[k,FRAN[k]]).map(([k,f])=>
    `<button class="subChip${subLines.includes(k)?" on":""}" data-k="${k}" style="--c:${f.c}">${esc(f.l)}</button>`).join("");
  head.innerHTML=`<div class="subTop">
      <div class="subTitle"><small>Marvel Cinematic Universe</small>Lines</div>
      <span class="subProg" id="subProg">✓ ${watched.size}/${visN().length}</span>
      <button class="subBtn" id="subSpoil" title="${esc(spoilerBtnTitle())}" aria-label="${esc(spoilerBtnTitle())}">${spoilerBtnLabel()}</button>
    </div>
    <div class="subChips">${chips}</div>
    <div class="subHint${msg?" warn":""}" id="subHint">${msg||T("subPickAll")+` · ${subLines.length}/${SUB_LINE_KEYS.length}`}</div>`;
}

function renderSubway(){
  subStepCache=null;
  renderSubHead();
  const map=document.getElementById("subMap");
  // lane order: FRAN order, except Netflix sits right next to Street so the Netflix Daredevil interchange
  // doesn't stretch across (and look connected to) the X-Men line in the Legacy section
  const lanes=SUB_LANE_ORDER.filter(k=>isSeries(k)&&subLines.includes(k));
  const laneOf={}; lanes.forEach((k,i)=>laneOf[k]=i);
  // titles with no line tag at all (only colour codes) still appear, as off-track stations in their own column
  const isSolo=n=>!LK(n).some(isSeries);   // standalones (no series yet) sit off-track
  const st=subOrder().filter(n=>LK(n).some(k=>k in laneOf)||isSolo(n));
  const soloLane=lanes.length;
  const W=Math.max(300,Math.min(map.clientWidth||subMapWrap.clientWidth||380,640));
  const MS=(THEMES[currentTheme]&&THEMES[currentTheme].metro)||{};
  const DEN=[{row:15,ph:28},{row:26,ph:34},{row:46,ph:40}][subDensity];
  const ROW=DEN.row, PH=DEN.ph, CUR=Math.max(ROW,30);
  // adaptive track spacing: lanes may use up to ~40% of the width (min 9px apart, max 17px)
  const phone=subIsPhone();
  const cols=lanes.length+1;
  const LG=cols<2?17:Math.max(phone?7:9,Math.min(17,(W*(phone?0.48:0.4)-24)/(cols-1)));
  const L0=Math.max(14,Math.min(22,LG+5));
  const SW=Math.max(2.4,Math.min(4.5,LG*0.27)), RR=Math.min(ROW*0.32,Math.max(3.4,Math.min(6.5,LG*0.38))), RI=Math.max(2.4,RR-1.5);
  const lx=i=>L0+i*LG, labelX=lx(soloLane)+22;
  // compact rows also carry the year (+ a ✓) on the same line, so leave ~7 characters for it
  const cw0=(subDensity===2?7.4:subDensity===1?6.9:6)*(MS.upper?1.18:1);
  const TK=Object.keys(FRAN).filter(isTheme), MM=false, mmW=0;
  const maxChars=Math.max(10,Math.floor((W-labelX-14-mmW)/cw0)-(subDensity===1?7:0)-(MS.logged&&subDensity===1?6:0));
  const cut=t=>t.length>maxChars?t.slice(0,maxChars-1)+"…":t;
  // theme highlight: matching rows get a band, their stations light up in the theme colour and a soft
  // marker stroke joins them; everything else fades
  const HL=null, TCOL=null, lit=()=>false;   // single-theme highlight retired
  map.classList.remove("hasTheme");
  subStepCache=null;
  let y=10, lastP=null; const pos={}, divs=[];
  st.forEach(n=>{ const sc=subSection(n); if(sc.key!==lastP){ divs.push({...sc,y}); y+=PH; lastP=sc.key; } pos[n.id]=y+ROW/2; y+=ROW; });
  const H=y+28;
  let o=`<svg viewBox="0 0 ${W} ${H}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  // phase dividers
  divs.forEach(d=>{
    o+=`<line x1="0" y1="${d.y+PH-8}" x2="${W}" y2="${d.y+PH-8}" stroke="var(--edge)" stroke-dasharray="3 4"/>`;
    o+=`<text x="${labelX}" y="${d.y+PH-15}" fill="${d.color}" style="font:600 11px 'Barlow Condensed';letter-spacing:.14em">${esc((((W-labelX)<240||!d.long)?d.label:d.long).toUpperCase())}</text>`;
  });
  // row backgrounds (hit areas) first, so tracks draw on top
  if(HL) st.forEach(n=>{ if(lit(n)) o+=`<rect class="thBand" x="2" y="${pos[n.id]-ROW/2+1.5}" width="${W-4}" height="${ROW-3}" rx="6" fill="${TCOL}" opacity=".14" pointer-events="none"/>`; });
  st.forEach(n=>{ o+=`<g class="row" data-id="${n.id}"><rect class="rowBg" x="0" y="${pos[n.id]-ROW/2}" width="${W}" height="${ROW}" rx="8" pointer-events="none"/><rect class="rowHit" x="${labelX-10}" y="${pos[n.id]-ROW/2}" width="${W-labelX+10}" height="${ROW}" fill="transparent"/></g>`; });
  // tracks (with a branch curve where a line spins off another active line)
  let hits="";
  // a line is split into segments where it runs empty for a while AND the next station doesn't build on
  // the previous one (e.g. the Sony Spider-Man films → Homecoming); each segment may branch off another line.
  const linked=(a,b)=>relations(b).parents.includes(a)||relations(a).parents.includes(b);
  o+=`<g class="dimTrk">`;
  lanes.forEach(k=>{
    const S=st.filter(n=>LK(n).includes(k)); if(!S.length) return;
    const x=lx(laneOf[k]), segs=[[S[0]]];
    for(let i=1;i<S.length;i++){
      const pv=S[i-1], cu=S[i];
      // a station added to this line on purpose (metro-only membership) never breaks the line around it
      const joined=(pv.metro&&pv.metro.includes(k))||(cu.metro&&cu.metro.includes(k));
      if(pos[cu.id]-pos[pv.id]>ROW*3.5 && !linked(pv,cu) && !joined) segs.push([cu]); else segs[segs.length-1].push(cu);
    }
    // gaps between segments: if anything after the gap builds on a station before it (same line),
    // the gap is drawn dashed — the story resumes later on this line (e.g. Doctor Strange → Multiverse of Madness)
    for(let i=1;i<segs.length;i++){
      const before=new Set(segs.slice(0,i).flat().map(n=>n.id));
      const resumes=segs.slice(i).flat().some(n=>relations(n).parents.some(b=>before.has(b.id)));
      if(resumes){
        const y1=pos[segs[i-1][segs[i-1].length-1].id], y2=pos[segs[i][0].id];
        const dd=`M${x} ${y1} L${x} ${y2}`;
        o+=`<path class="track gap" data-k="${k}" d="${dd}" fill="none" stroke="${FRAN[k].c}" stroke-width="${Math.max(1.6,SW*0.55)}" stroke-dasharray="2 6" stroke-linecap="round" opacity=".75"/>`;
        hits+=`<path class="trackHit" data-k="${k}" d="${dd}" fill="none" stroke="transparent" stroke-width="${Math.max(6,LG)}" pointer-events="stroke"/>`;
      }
    }
    segs.forEach(seg=>{
      const first=seg[0], last=seg[seg.length-1];
      let d=`M${x} ${pos[first.id]} L${x} ${pos[last.id]}`;
      // a line that begins at an interchange simply starts there: the station already joins it to the other
      // lines, so no branch curve is pulled in from some earlier, unrelated station (e.g. Guardians → Age of Ultron)
      const startsAtInterchange=LK(first).some(q=>q!==k && q in laneOf);
      const from=startsAtInterchange?null:relations(first).parents
        .filter(b=>pos[b.id]!=null && pos[b.id]<pos[first.id] && LK(b).some(q=>q!==k && q in laneOf) && !LK(b).includes(k))
        .sort((a,b)=>pos[b.id]-pos[a.id])[0];
      if(from){
        const bx=lx(laneOf[LK(from).find(q=>q in laneOf)]), by=pos[from.id];
        // the transition's height grows with the horizontal distance, so wide branches bend smoothly
        // instead of flattening into a near-horizontal S (capped at the segment's first station)
        const want=Math.max(CUR*1.6,Math.abs(x-bx)*2.4), ey=Math.min(by+want,pos[first.id]), h=ey-by;
        // when the next station is too close to give the curve its full height, push the control points
        // further out so both ends still visibly bend (vertical in, vertical out) instead of a straight diagonal
        const cv=h*0.78;   // long vertical tangents → a smooth S: not a straight diagonal, not a flat step
        d=`M${bx} ${by} C${bx} ${by+cv} ${x} ${ey-cv} ${x} ${ey} L${x} ${pos[last.id]}`;
      }
      if(MS.track==="wire"){
        o+=`<path d="${d}" fill="none" stroke="${FRAN[k].c}" stroke-width="${SW*1.9}" opacity=".14" stroke-linecap="round" pointer-events="none"/>`;
        o+=`<path class="track" data-k="${k}" d="${d}" fill="none" stroke="${FRAN[k].c}" stroke-width="${Math.max(1.2,SW*0.38)}" stroke-linecap="round"/>`;
      }else if(MS.track==="ink"){
        o+=`<path d="${d}" fill="none" stroke="#141010" stroke-width="${SW+2.8}" stroke-linecap="round" pointer-events="none"/>`;
        o+=`<path class="track" data-k="${k}" d="${d}" fill="none" stroke="${FRAN[k].c}" stroke-width="${SW}" stroke-linecap="round"/>`;
      }else o+=`<path class="track" data-k="${k}" d="${d}" fill="none" stroke="${FRAN[k].c}" stroke-width="${SW}" stroke-linecap="round"/>`;
      hits+=`<path class="trackHit" data-k="${k}" d="${d}" fill="none" stroke="transparent" stroke-width="${Math.max(6,LG)}" pointer-events="stroke"/>`;
    });
  });
  o+=`</g>`;
  if(HL){
    // the marker stroke: a wide, soft line hopping from one matching station to the next
    const pts=st.filter(lit).map(n=>{ const ks=LK(n).filter(k=>k in laneOf).sort((a,b)=>laneOf[a]-laneOf[b]);
      return [ks.length?lx(laneOf[ks[ks.length-1]]):lx(soloLane), pos[n.id]]; });
    if(pts.length>1){
      let d=`M${pts[0][0]} ${pts[0][1]}`;
      for(let i=1;i<pts.length;i++){ const [a,b]=pts[i-1],[c,e]=pts[i],m=(e-b)*0.5; d+=` C${a} ${b+m} ${c} ${e-m} ${c} ${e}`; }
      o+=`<path class="swash" d="${d}" fill="none" stroke="${TCOL}" stroke-width="${Math.max(8,LG*1.15)}" stroke-linecap="round" stroke-linejoin="round" opacity=".3" pointer-events="none"/>`;
    }
  }
  o+=hits;   // track hit areas sit above the tracks but below the stations
  // stations + labels (dots, interchange pills and titles are interactive; the connector line is not)
  st.forEach(n=>{
    const ks=LK(n).filter(k=>k in laneOf).sort((a,b)=>laneOf[a]-laneOf[b]); const yy=pos[n.id];
    const isW=watched.has(n.id);
    const L=lit(n);
    let g=`<g class="row st${HL&&!L?" off":""}${n.fr.some(isTheme)?" thm":""}" data-id="${n.id}">`;
    // leader line: from the station's right-most dot across the other tracks to its title
    const code=n.fr.filter(isTheme);
    const leadC = L ? TCOL : ks.length ? FRAN[ks[ks.length-1]].c : (code[0]?FRAN[code[0]].c:"var(--dim)");
    { const x1=(ks.length?lx(laneOf[ks[ks.length-1]]):lx(soloLane))+RR+1.5;
      if(labelX-8>x1 && (subDensity>0||ks.length>1)) g+=`<line class="lead" pointer-events="none" x1="${x1}" y1="${yy}" x2="${labelX-8}" y2="${yy}" stroke="${leadC}" style="color:${leadC}" stroke-width="${L?1.5:0.9}" stroke-linecap="round" opacity="${L?.95:.7}"/>`; }
    if(!ks.length){
      // off-track station: no line, coloured by its first colour code; a square marks "not on a line"
      const x=lx(soloLane), r=RR;
      g+=`<rect class="solo" x="${x-r}" y="${yy-r}" width="${2*r}" height="${2*r}" rx="2" fill="${(isW||L)?leadC:"var(--panel)"}" stroke="${leadC}" stroke-width="${Math.min(2.6,SW*0.6)}"${n.series?' stroke-dasharray="3 2.2"':""}/>`;
    }
    if(ks.length>1 && MS.station==="diamond"){
      // HUD interchange: a pair of square brackets around the dots
      const a=lx(laneOf[ks[0]])-RR-3, b=lx(laneOf[ks[ks.length-1]])+RR+3, h=RR+2.5;
      g+=`<path class="ix" d="M${a+2} ${yy-h} H${a} V${yy+h} H${a+2} M${b-2} ${yy-h} H${b} V${yy+h} H${b-2}" fill="none" stroke="var(--ink)" stroke-width="1.2"/>`;
    }else if(ks.length>1){
      const a=lx(laneOf[ks[0]]), b=lx(laneOf[ks[ks.length-1]]);
      g+=`<rect x="${a-RR-2.5}" y="${yy-RR-2.5}" width="${b-a+2*RR+5}" height="${2*RR+5}" rx="${RR+2.5}" fill="${MS.station==="comic"?"#fff":"var(--void)"}" stroke="var(--ink)" stroke-width="${MS.station==="comic"?2.2:2}"/>`;
    }
    ks.forEach(k=>{
      if(MS.station==="diamond"){
        const cx=lx(laneOf[k]), r=(ks.length>1?RI:RR)*1.15;
        g+=`<polygon points="${cx},${yy-r} ${cx+r},${yy} ${cx},${yy+r} ${cx-r},${yy}" fill="${L?TCOL:isW?FRAN[k].c:"var(--void)"}" stroke="${L?TCOL:FRAN[k].c}" stroke-width="1.2"${n.series?' stroke-dasharray="2 1.6"':""}/>`;
        return;
      }
      if(MS.station==="comic"){
        g+=`<circle cx="${lx(laneOf[k])}" cy="${yy}" r="${(ks.length>1?RI:RR)+0.6}" fill="${L?TCOL:isW?FRAN[k].c:"#fff"}" stroke="#141010" stroke-width="1.8"${n.series?' stroke-dasharray="3 2"':""}/>`;
        return;
      }
      g+=`<circle cx="${lx(laneOf[k])}" cy="${yy}" r="${(ks.length>1?RI:RR)+(L?0.8:0)}" fill="${L?TCOL:isW?FRAN[k].c:"var(--panel)"}" stroke="${L?TCOL:FRAN[k].c}" stroke-width="${Math.min(2.6,SW*0.6)}"${n.series?' stroke-dasharray="3 2.2"':""}/>`;
    });
    const sub=`${n.y}${n.series?" · "+T("series"):""}${n.theory?" · "+T("theoryTag"):""}`;
    const tick=isW?(MS.logged?` <tspan fill="${WATCHED_COLOR}">// LOGGED</tspan>`:` <tspan fill="${MS.station==="comic"?"#0a8a4a":"#2ecc71"}">✓</tspan>`):"";
    const tt=t=>MS.upper?t.toUpperCase():t;
    if(subDensity===2){
      g+=`<text x="${labelX}" y="${yy-1}" fill="var(--ink)" style="font:600 13.5px 'Barlow',system-ui,sans-serif">${esc(cut(tt(n.t)))}</text>`;
      g+=`<text x="${labelX}" y="${yy+14}" fill="var(--dim)" style="font:500 11px 'Barlow',system-ui,sans-serif">${esc(sub)}${tick}</text>`;
    }else if(subDensity===1){
      g+=`<text x="${labelX}" y="${yy+4.5}" fill="var(--ink)" style="font:600 12.5px 'Barlow',system-ui,sans-serif">${esc(cut(tt(n.t)))}<tspan fill="var(--dim)" style="font-weight:500;font-size:10.5px"> ${n.y}</tspan>${tick}</text>`;
    }else if(ks.length>1){
      // overview: only interchanges keep a label; every other title shows on hover / tap
      g+=`<text x="${labelX}" y="${yy+3.5}" fill="var(--dim)" style="font:600 10.5px 'Barlow',system-ui,sans-serif">${esc(cut(tt(n.t)))}</text>`;
    }
    o+=g+"</g>";
  });
  map.innerHTML=o+`<g id="subNums" pointer-events="none"></g></svg>`;
  subGeo={pos,lx,laneOf,st,RR,ROW};
  // comic theme: each station's highlight panel leans its own random way
  map.querySelectorAll("g.row").forEach(g=>g.style.setProperty("--tilt",((Math.random()<.5?-1:1)*(0.7+Math.random()*1.1)).toFixed(2)+"deg"));
  if(subLineSel&&!(subLineSel in laneOf)) subLineSel=null;
  setTimeout(()=>{ if(!subMarked) restLine(); });
  if(subMarked) subMark(subMarked);   // keep the highlight across re-renders (e.g. after marking watched)
}
// turn a theme highlight on (or off when it's already active / k is null)
function setSubTheme(k){
  subTheme=(k&&k!==subTheme&&isTheme(k))?k:null;
  if(pinnedNode) dismissPinned(); else clear();
  if(subFocus){ subFocus=null; subFocusEl.classList.remove("on"); subMapWrap.classList.remove("away"); }
  renderSubway();
  if(subTheme){   // bring the first matching title into view
    const first=subOrder().find(n=>n.fr.includes(subTheme));
    const r=first&&document.querySelector(`#subMap g.row[data-id="${first.id}"] .rowBg`);
    if(r){ const b=r.getBoundingClientRect(), wr=subMapWrap.getBoundingClientRect(); subMapWrap.scrollTop+=b.top-wr.top-140; }
  }
}
function setDensity(dn){
  dn=Math.max(0,Math.min(2,dn)); if(dn===subDensity) return;
  // remember which station is in the middle of the screen, re-render, scroll it back to the middle
  const wr=subMapWrap.getBoundingClientRect(), mid=wr.top+wr.height/2;
  let best=null, bd=1e9;
  document.querySelectorAll("#subMap g.row .rowBg").forEach(r=>{ const b=r.getBoundingClientRect(), dd=Math.abs(b.top+b.height/2-mid); if(dd<bd){bd=dd;best=r.parentNode.dataset.id;} });
  subDensity=dn; renderSubway(); updateDensityLabel(); saveToggles();
  const r=best&&document.querySelector(`#subMap g.row[data-id="${best}"] .rowBg`);
  if(r){ const b=r.getBoundingClientRect(); subMapWrap.scrollTop+= (b.top+b.height/2)-mid; }
}
function updateDensityLabel(){
  if(ORIENT!=="v") return;
  const z=document.getElementById("zlbl"); if(z) z.textContent=T(["denOverview","denCompact","denNormal"][subDensity]);
  document.getElementById("zout").disabled=subDensity===0;
  document.getElementById("zin").disabled=subDensity===2;
}
// pinch on the map steps through the density levels (one step per pinch gesture)
(()=>{
  let d0=null, stepped=false;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  subMapWrap.addEventListener("touchstart",e=>{ if(e.touches.length===2){ d0=dist(e.touches); stepped=false; } },{passive:true});
  subMapWrap.addEventListener("touchmove",e=>{
    if(e.touches.length!==2||d0==null) return;
    e.preventDefault();
    if(stepped) return;
    const r=dist(e.touches)/d0;
    if(r<0.72){ setDensity(subDensity-1); stepped=true; }
    else if(r>1.38){ setDensity(subDensity+1); stepped=true; }
  },{passive:false});
  subMapWrap.addEventListener("touchend",e=>{ if(e.touches.length<2) d0=null; },{passive:true});
})();

// highlight one station's connector line (desktop hover / mobile tap)
let subMarked=null;
function subMark(id){
  subMarked=id;
  document.querySelectorAll("#subMap g.act").forEach(g=>g.classList.remove("act"));
  if(id) document.querySelectorAll(`#subMap g.row[data-id="${id}"]`).forEach(g=>g.classList.add("act"));
  // number the stops of every line this title is on (or clear when nothing is marked)
  if(id&&BY[id]) showSeq(LK(BY[id]).filter(k=>subGeo&&k in subGeo.laneOf), id); else if(!document.getElementById("subTip").classList.contains("on")) restLine();
}
// sequence numbers on the dots of the given lines, in the current order (Release / Story / Steps)
let subGeo=null;
function showSeq(keys, focusId){
  const g=document.getElementById("subNums"); if(!g||!subGeo) return;
  const {pos,lx,laneOf,st,RR,ROW}=subGeo;
  // numbered dots are bigger in Steps order (where the sequence is the point), and the dot you're on is bigger still
  const steps=subOrderMode==="steps";
  const base=Math.max(6.2,Math.min(8,RR+2.6))*(steps?1.35:1);
  // collect the badges first, so stations numbered on two neighbouring lanes can be staggered instead of overlapping
  const gap=lx(1)-lx(0), badges=[];
  keys.forEach(k=>{
    const S=st.filter(n=>LK(n).includes(k)); const x=lx(laneOf[k]);
    S.forEach((n,i)=>{ const me=n.id===focusId; badges.push({id:n.id,x,y:pos[n.id],k,num:i+1,me,r:me?base*1.4:base}); });
  });
  const byRow={}; badges.forEach(b=>(byRow[b.id]=byRow[b.id]||[]).push(b));
  Object.values(byRow).forEach(list=>{
    if(list.length<2) return;
    list.sort((a,b)=>a.x-b.x);
    const crowded=list.some((b,j)=>j&&b.x-list[j-1].x<b.r+list[j-1].r+1);
    if(!crowded) return;
    // interchange with too many numbers for its lanes: lay the badges out side by side in lane order,
    // centred on the interchange, so none overlaps (each keeps its line colour)
    const sp=2, total=list.reduce((t,b)=>t+2*b.r,0)+sp*(list.length-1), cx=(list[0].x+list[list.length-1].x)/2;
    let x=cx-total/2;
    list.forEach(b=>{ b.x=x+b.r; x+=2*b.r+sp; });
  });
  let o="", top="";   // the dot you're on is drawn last so it sits above neighbouring lanes
  badges.forEach(bd=>{
    const y=bd.y+(bd.dy||0), fs=bd.r*1.18;
    const one=`<circle cx="${bd.x}" cy="${y}" r="${bd.r}" fill="${FRAN[bd.k].c}" stroke="${bd.me?"var(--ink)":"var(--void)"}" stroke-width="${bd.me?2.2:1.5}"/>`
      +`<text x="${bd.x}" y="${y+fs*0.36}" text-anchor="middle" fill="#fff" style="font:700 ${fs}px 'Barlow Condensed',system-ui,sans-serif">${bd.num}</text>`;
    if(bd.me) top+=one; else o+=one;
  });
  o+=top;
  g.innerHTML=o;
}

function fChip(x,kind){
  if(!x) return "";
  return `<button class="sfChip${kind?" x":""}${watched.has(x.id)?" w":""}" data-id="${x.id}"><i style="background:${lineColor(x)}"></i>${esc(x.t)} <small>${x.y}${kind?" · "+T(kind==="woven"?"woven":kind==="shared"?"shared":"theory").replace(/^[^\w]+\s*/,""):""}</small></button>`;
}
function renderFocus(n,opt={}){
  const sc=subFocusEl.scrollTop;
  const r=relations(n), order=subOrder(), isW=watched.has(n.id), locked=spoilerFree&&!isW&&!n.theory;
  const lines=LK(n).filter(isSeries);
  const allTags=n.fr.filter(k=>FRAN[k]);
  const rails=lines.length?lines.map(k=>`<span style="background:${FRAN[k].c}"></span>`).join(""):`<span style="background:var(--edge)"></span>`;
  const tags=allTags.map(k=>isTheme(k)
      ?`<span class="thTag" style="--c:${FRAN[k].c}">${esc(FRAN[k].l)}</span>`
      :`<span style="background:${FRAN[k].c}">${esc(FRAN[k].l)}</span>`).join("")
    +`<span style="background:${PHASE_COLOR[n.p]}">${esc(PHASE_LABEL(n.p))}</span>`
    +(n.series?`<span style="background:${CK_STROKE}">${T("series")}</span>`:"")
    +(n.theory?`<span style="background:#e0533d">${T("theoryTag")}</span>`:"");
  const nav=lines.map(k=>{
    const seq=order.filter(x=>LK(x).includes(k)), i=seq.indexOf(n), pv=seq[i-1], nx=seq[i+1];
    return `<div class="sfLine" style="--c:${FRAN[k].c}">
      ${pv?`<button class="sfChip prev" data-id="${pv.id}" data-dir="-1">‹ ${esc(pv.t)}</button>`:`<span class="end">${T("lineStart")}</span>`}
      <span class="nm">${esc(FRAN[k].l)}</span>
      ${nx?`<button class="sfChip" data-id="${nx.id}" data-dir="1">${esc(nx.t)} ›</button>`:`<span class="end">${T("lineEnd")}</span>`}
    </div>`;}).join("");
  subFocusEl.innerHTML=`<div class="sfWrap">
    <div class="sfTop"><button class="subBtn" id="sfBack">← ${T("subMap")}</button>
      <div class="ln">${lines.map(k=>`<span style="--c:${FRAN[k].c}">${esc(FRAN[k].l)}</span>`).join("")}</div></div>
    ${r.parents.length?`<div class="sfLab">${T("buildsOn")}</div><div class="sfChips">${r.parents.map(x=>fChip(x)).join("")}</div>`:""}
    <div class="sfRails">${rails}</div>
    <div class="sfCard" id="sfCard">
      <div class="t">${esc(n.t)}</div>
      <div class="sfMeta">${n.y}</div>
      <div class="sfTags">${tags}</div>
      <div class="sfDesc${locked?" locked":""}">${esc(DESC(n))}</div>
      ${MEMO_HTML(n,"memo")}
      ${locked?`<div class="sfLock">${T("locked")}</div>`:""}
      <button class="infoCheck${isW?" on":""}" data-id="${n.id}" role="checkbox" aria-checked="${isW}"
        style="--watched-c:${WATCHED_COLOR};--watched-ink:${WATCHED_INK}"><span class="box">✓</span>${isW?T("isWatched"):T("markWatched")}</button>
    </div>
    <div class="sfRails">${rails}</div>
    ${r.feeds.length?`<div class="sfLab">${T("setsUp")}</div><div class="sfChips">${r.feeds.map(x=>fChip(x)).join("")}</div>`:""}
    ${nav?`<div class="sfSec"><div class="sfLab">${T("onLines")}</div>${nav}</div>`:""}
    ${r.extra.length?`<div class="sfSec"><div class="sfLab">${T("related")}</div><div class="sfChips">${r.extra.map(([x,k])=>fChip(x,k)).join("")}</div></div>`:""}
  </div>`;
  if(opt.keepScroll) subFocusEl.scrollTop=sc; else subFocusEl.scrollTop=0;
  const card=document.getElementById("sfCard"), rl=subFocusEl.querySelectorAll(".sfRails span");
  const ease="cubic-bezier(.2,.8,.2,1)";
  if(opt.fromRect && card.animate){
    // B→C: the card grows out of the tapped station row
    const c=card.getBoundingClientRect(), f=opt.fromRect;
    const dy=(f.top+f.height/2)-(c.top+c.height/2);
    card.animate([{transform:`translateY(${dy}px) scale(.55)`,opacity:.15},{transform:"none",opacity:1}],{duration:380,easing:ease});
    rl.forEach(sp=>sp.animate([{transform:"scaleY(0)"},{transform:"scaleY(1)"}],{duration:420,delay:120,easing:ease,fill:"backwards"}));
  }else if(opt.dir && card.animate){
    // C→C: ride one stop up/down the line
    card.animate([{transform:`translateY(${opt.dir*46}px)`,opacity:0},{transform:"none",opacity:1}],{duration:300,easing:ease});
    rl.forEach(sp=>sp.animate([{opacity:.2},{opacity:1}],{duration:300}));
  }
}
function openFocus(n,opt={}){
  if(pinnedNode) dismissPinned(); else clear();
  subHoverId=null;
  subFocus=n;
  renderFocus(n,opt);
  subMapWrap.classList.add("away");
  subFocusEl.classList.add("on");
}
function closeFocus(){
  const n=subFocus; subFocus=null;
  subFocusEl.classList.remove("on");
  subMapWrap.classList.remove("away");
  if(!n) return;
  const bg=document.querySelector(`#subMap .row[data-id="${n.id}"] .rowBg`);
  if(bg){
    const r=bg.getBoundingClientRect(), wr=subMapWrap.getBoundingClientRect();
    subMapWrap.scrollTop+= (r.top+r.height/2)-(wr.top+wr.height/2);
    bg.classList.remove("flash"); void bg.getBoundingClientRect(); bg.classList.add("flash");
  }
}
function openSubway(save=true){
  subOpen=true; subEl.classList.add("on");
  if(typeof dismissPinned==="function" && pinnedNode) dismissPinned();
  info.classList.remove("on");
  renderSubway();
  if(save) saveToggles();
}
function closeSubway(save=true){
  if(pinnedNode) dismissPinned(); else clear();
  subOpen=false; subFocus=null; subEl.classList.remove("on");
  subFocusEl.classList.remove("on"); subMapWrap.classList.remove("away");
  if(save) saveToggles();
}

const subTip=document.getElementById("subTip");
let subTipTimer=null;
function showLineTip(k,x,y,autoHide){
  if(!FRAN[k]){ hideLineTip(); return; }
  subTip.textContent=FRAN[k].l; subTip.style.setProperty("--c",FRAN[k].c);

  showSeq([k]);
  clearTimeout(subTipTimer); if(autoHide) subTipTimer=setTimeout(hideLineTip,2600);

// a clicked/tapped line stays highlighted (track + its stations' numbers) until a click elsewhere
let subLineSel=null;
function restLine(){
  document.querySelectorAll("#subMap .track").forEach(p=>p.classList.toggle("hl",!!subLineSel&&p.dataset.k===subLineSel));
  document.querySelectorAll("#subMap .row").forEach(g=>g.classList.toggle("lineSel",!!subLineSel&&!!BY[g.dataset.id]&&LK(BY[g.dataset.id]).includes(subLineSel)));
  showSeq(subLineSel?[subLineSel]:[]);
}
function setLineSel(k){ subLineSel=k; restLine(); }
function hideLineTip(){ subTip.classList.remove("on"); clearTimeout(subTipTimer);
  if(subMarked) { restLine(); subMark(subMarked); } else restLine(); }
subMapWrap.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||pinnedNode||subFocus) return;
  const th=e.target.closest(".trackHit");
  if(th){ if(subHoverId){ subHoverId=null; clear(); } showLineTip(th.dataset.k,e.clientX,e.clientY,false); return; }
  hideLineTip();
  const row=e.target.closest("#subMap .row");
  const id=row&&row.dataset.id;
  if(id!==subHoverId){
    subHoverId=id;
    if(id&&BY[id]){ info.style.left=""; info.style.top=""; focus(BY[id]); subMark(id); } else clear();
  }
  if(id) moveInfo(e);
});
subMapWrap.addEventListener("pointerleave",e=>{ hideLineTip(); if(e.pointerType==="mouse"&&!pinnedNode){ subHoverId=null; clear(); } });
subMapWrap.addEventListener("scroll",()=>{ hideLineTip(); if(!pinnedNode&&subHoverId){ subHoverId=null; clear(); } },{passive:true});
subEl.addEventListener("click",e=>{
  const chip=e.target.closest(".subChip");
  if(chip){
    const k=chip.dataset.k;
    if(subLines.includes(k)) subLines=subLines.filter(x=>x!==k);
    else if(subLines.length>=subMax()){ renderSubHead(T("subMax")); return; }
    else subLines=[...subLines,k];
    renderSubway(); saveToggles(); return;
  }
  if(e.target.closest("#subSpoil")){ spoilerBtn.click(); renderSubway(); if(subFocus) renderFocus(subFocus,{keepScroll:true}); return; }
  if(e.target.closest("#sfBack")){ closeFocus(); return; }
  const ck=e.target.closest(".infoCheck");
  if(ck){ toggleWatched(ck.dataset.id); return; }
  const th=e.target.closest("#subMap .trackHit");
  if(th){ const k=th.dataset.k;
    if(subPtr!=="mouse"&&pinnedNode) dismissPinned();
    if(subLineSel===k){ setLineSel(null); hideLineTip(); return; }
    setLineSel(k); showLineTip(k,e.clientX,e.clientY,subPtr!=="mouse"); return; }
  const row=e.target.closest("#subMap .row");
  if(!row && subLineSel) setLineSel(null);
  if(row && BY[row.dataset.id]){
    const n=BY[row.dataset.id];
    if(subPtr!=="mouse"){ pinNode(n); subMark(n.id); return; }          // touch/pen: same popup as the graph, pinned
    const bg=document.querySelector(`#subMap .row[data-id="${n.id}"] .rowBg`)||row;
    clear(); openFocus(n,{fromRect:bg.getBoundingClientRect()}); return;
  }
  if(pinnedNode && !e.target.closest(".subChip,#subHead button")){ dismissPinned(); }
  const fc=e.target.closest(".sfChip");
  if(fc && BY[fc.dataset.id]){
    const tgt=BY[fc.dataset.id];
    let dir=+fc.dataset.dir||0;
    if(!dir){ const o=subOrder(); dir=o.indexOf(tgt)<o.indexOf(subFocus)?-1:1; }
    openFocus(tgt,{dir});
  }
});
document.addEventListener("keydown",e=>{

  if(subFocus) closeFocus(); else if(subLineSel) setLineSel(null);
});

      focus(BY["tasm3"]);

// ---------------- PAN / ZOOM ----------------
const stage=document.getElementById("stage");
let scale=1,tx=0,ty=0,curW=0,curH=0,defaultScale=1;
function apply(){tree.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  if(ORIENT!=="v") document.getElementById("zlbl").textContent=Math.round(scale*100)+"%";}
function fit(){
  curW=svg.width.baseVal.value; curH=svg.height.baseVal.value;
  const bar=document.querySelector(".bar");
  const topPad=(bar?bar.offsetHeight:56)+12;   // clear the (possibly wrapped) toolbar
  const botPad=76;                              // clear the zoom controls
  // clear the phase jump rail too, when it's actually on screen (vertical mode) — measure its real
  // rendered edge so this adapts whether it's collapsed to a thin tab or fully expanded.
  let leftPad=0;
  if(jumpRail && !jumpRail.hidden){
    const r=jumpRail.getBoundingClientRect();
    leftPad=Math.max(0, r.right+10);
  }
  const vw=innerWidth-leftPad, vh=innerHeight-topPad-botPad;
  scale=Math.min(vw/curW, vh/curH)*0.92;
  defaultScale=scale;   // remember the "resting" zoom level so jumpToPhase can tell if the user has since zoomed manually
  tx=leftPad+(vw-curW*scale)/2; ty=topPad+(vh-curH*scale)/2; apply();
}

// ---------------- JUMP RAIL (phase navigator, vertical/chapters mode only) ----------------
const jumpRail=document.getElementById("jumpRail");
function refreshJumpRail(){
  if(!isChapters() || !lastBandInfo){ jumpRail.hidden=true; return; }
  jumpRail.hidden=false;
  jumpRail.classList.toggle("collapsed", !showJumpRail);
  jumpRail.innerHTML="";
  const toggle=document.createElement("button");
  toggle.className="jrToggle";
  toggle.title=showJumpRail?"Hide phase jump menu":"Show phase jump menu";
  toggle.textContent=showJumpRail?"‹":"›";
  toggle.onclick=()=>{
    showJumpRail=!showJumpRail;
    saveToggles();
    refreshJumpRail();
  };
  jumpRail.appendChild(toggle);
  const wrap=document.createElement("div");
  wrap.className="jrPhases";
  for(let p=0;p<=MAX_PHASE;p++){
    if(!lastBandInfo[p]) continue;
    const b=document.createElement("button");
    b.className="jrPhaseBtn";
    b.style.setProperty("--jr-c", PHASE_COLOR[p]);
    b.textContent=p===0?"X":p;
    b.title=T("jump")+" "+PHASE_LABEL(p);
    b.onclick=()=>jumpToPhase(p);
    wrap.appendChild(b);
  }
  jumpRail.appendChild(wrap);
}
function jumpToPhase(p){
  if(!lastBandInfo || !lastBandInfo[p]) return;
  const bi=lastBandInfo[p];
  const bar=document.querySelector(".bar");
  const topPad=(bar?bar.offsetHeight:56)+12, botPad=76;
  let leftPad=0;
  if(jumpRail && !jumpRail.hidden){
    const r=jumpRail.getBoundingClientRect();
    leftPad=Math.max(0, r.right+10);
  }
  const viewW=innerWidth-leftPad, viewH=innerHeight-topPad-botPad;

  // only zoom in if we're still at the original "fit all" scale — if the user already zoomed
  // manually since then, just pan to the phase and leave their zoom level alone.
  const atDefaultZoom=Math.abs(scale-defaultScale)<0.01;
  if(atDefaultZoom){
    const bandW=Math.max(1,bi.right-bi.left), bandH=Math.max(1,bi.bottom-bi.top);
    const fitScale=Math.min(viewW/bandW, viewH/bandH)*0.9;
    scale=Math.max(defaultScale, Math.min(2.6, fitScale));  // never zoom OUT past the default
  }

  const targetY=lastOy+(bi.top+bi.bottom)/2;      // absolute internal-SVG y of this phase's band center
  const targetX=lastOx+(bi.left+bi.right)/2;
  const viewCenterY=topPad+viewH/2;
  ty=viewCenterY-targetY*scale;
  if(atDefaultZoom){
    // also center horizontally when we zoomed in, so the band sits clear of other phases
    tx=leftPad+viewW/2-targetX*scale;
  }
  tree.style.transition="transform .45s cubic-bezier(.4,0,.2,1)";
  apply();
  setTimeout(()=>{ tree.style.transition="none"; }, 470);
}

let drag=false,sx,sy;
stage.addEventListener("mousedown",e=>{drag=true;sx=e.clientX-tx;sy=e.clientY-ty;stage.classList.add("drag")});
addEventListener("mouseup",()=>{drag=false;stage.classList.remove("drag")});
addEventListener("mousemove",e=>{if(drag){tx=e.clientX-sx;ty=e.clientY-sy;apply()}});
// zoom by factor f, keeping the point (cx,cy) fixed on screen — shared by wheel, double-click, and pinch
function zoomAt(cx,cy,f){
  const newScale=Math.max(.2,Math.min(2.6,scale*f));
  f=newScale/scale;
  tx=cx-(cx-tx)*f; ty=cy-(cy-ty)*f;
  scale=newScale; apply();
}
stage.addEventListener("wheel",e=>{e.preventDefault();
  zoomAt(e.clientX,e.clientY, e.deltaY<0?1.12:0.89);},{passive:false});
document.getElementById("zin").onclick=()=>{ if(ORIENT==="v"){ setDensity(subDensity+1); return; } scale=Math.min(2.6,scale*1.15);apply()};
document.getElementById("zout").onclick=()=>{ if(ORIENT==="v"){ setDensity(subDensity-1); return; } scale=Math.max(.2,scale*.87);apply()};
document.getElementById("reset").onclick=fit;
// double-click / double-tap: zoom in one step, anchored on the click point (not the browser's native page zoom)
stage.addEventListener("dblclick",e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, 1.6);
});
// double-clicking UI chrome (buttons, tag chips, theme picker, etc.) should just suppress the
// browser's native zoom-in-on-double-click — it must NOT also zoom the canvas underneath.
document.addEventListener("dblclick",e=>{
  if(!stage.contains(e.target)) e.preventDefault();
},{capture:true});
// touch
let lt=null, ld=null, lmid=null, uiTouch=false;
let tapStart=null;  // {x,y,time,target} — used to distinguish a tap (open/close info card) from a pan/pinch
function midpoint(t){
  return { x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 };
}
// true if the touch originated on the toolbar (tag menu, buttons, theme picker, zoom controls)
// rather than the canvas itself — those regions handle their own scrolling/taps.
function isChromeTouch(e){
  const t=e.target;
  return !!(t.closest && t.closest(".bar, .ctl, .themePicker, #info"));
}
stage.addEventListener("touchstart",e=>{
  uiTouch = isChromeTouch(e);
  if(uiTouch) return;   // let the toolbar/tag menu handle its own touch (e.g. horizontal tag scroll)
  if(e.touches.length===1){
    lt={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty};
    tapStart={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now(),target:e.target};
  }
  if(e.touches.length===2){
    ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    lmid=midpoint(e.touches);
    lt=null; // stop single-finger pan while pinching
    tapStart=null; // a second finger means this is a pinch, not a tap
  }
},{passive:false});
stage.addEventListener("touchmove",e=>{
  if(uiTouch) return;    // don't hijack scrolling inside the toolbar/tag menu
  e.preventDefault();
  if(e.touches.length===1&&lt){
    tx=e.touches[0].clientX-lt.x; ty=e.touches[0].clientY-lt.y; apply();
  }
  if(e.touches.length===2&&ld){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const mid=midpoint(e.touches);
    let f=d/ld;
    // clamp so we don't overshoot the scale limits, then keep the pinch midpoint anchored
    const newScale=Math.max(.2,Math.min(2.6,scale*f));
    f=newScale/scale;
    // anchor zoom on the current midpoint (same math as wheel-zoom)
    tx=mid.x-(mid.x-tx)*f;
    ty=mid.y-(mid.y-ty)*f;
    // also pan by how much the two fingers' center moved (lets you drag while pinching)
    tx+=mid.x-lmid.x;
    ty+=mid.y-lmid.y;
    scale=newScale; ld=d; lmid=mid; apply();
  }
},{passive:false});
stage.addEventListener("touchend",e=>{
  if(e.touches.length<2){ ld=null; lmid=null; }
  // if one finger remains after a pinch, resume panning from its position
  if(e.touches.length===1 && !uiTouch){ lt={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty}; }
  // resolve tap vs. drag: a short, mostly-stationary touch is a tap (open/close the info card)
  if(!uiTouch && tapStart && e.touches.length===0){
    const ct=e.changedTouches[0];
    const dist=ct?Math.hypot(ct.clientX-tapStart.x, ct.clientY-tapStart.y):999;
    const elapsed=Date.now()-tapStart.time;
    if(dist<10 && elapsed<450){
      const nodeEl = tapStart.target.closest && tapStart.target.closest(".node");
      const onCheck = tapStart.target.closest && tapStart.target.closest(".check");
      if(nodeEl && !onCheck){
        const n=BY[nodeEl.dataset.id];
        if(n) pinNode(n);
      } else if(!nodeEl){
        if(pinnedNode) dismissPinned();  // tapped empty canvas — close the pinned card
      }
    }
  }
  tapStart=null;
  if(e.touches.length===0) uiTouch=false;
},{passive:false});

function updateThemeIconTitle(){
  themeIconBtn.title="Theme: "+(THEMES[currentTheme]?.label||currentTheme)+" — tap to switch";
